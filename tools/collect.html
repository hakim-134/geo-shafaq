<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UzbGuessr · collect locations</title>
    <style>
      body { font: 13px/1.5 monospace; margin: 16px; }
      textarea { width: 100%; height: 60vh; }
    </style>
  </head>
  <body>
    <p id="status">Loading…</p>
    <textarea id="out" readonly></textarea>
    <script src="../config.js"></script>
    <script src="../js/border.js"></script>
    <script>
      // Rebuilds js/locations.js from Yandex's panorama coverage tiles.
      const SEEDS_PER_TILE = 3;
      const status = (s) => (document.getElementById("status").textContent = s);

      async function tilePixels(x, y, z) {
        const r = await fetch(
          `https://core-stv-renderer.maps.yandex.net/2.x/tiles?l=stv&x=${x}&y=${y}&z=${z}&v=1&format=png`,
        );
        if (!r.ok) return [];
        const blob = await r.blob();
        if (!blob.size) return [];
        let bm;
        try {
          bm = await createImageBitmap(blob);
        } catch {
          return [];
        }
        const c = new OffscreenCanvas(256, 256);
        const g = c.getContext("2d");
        g.drawImage(bm, 0, 0);
        const d = g.getImageData(0, 0, 256, 256).data;
        const out = [];
        for (let py = 0; py < 256; py++)
          for (let px = 0; px < 256; px++)
            if (d[(py * 256 + px) * 4 + 3] > 150) out.push([x * 256 + px, y * 256 + py]);
        return out;
      }

      function makeInside(geojson) {
        const polys = geojson.type === "Polygon" ? [geojson.coordinates] : geojson.coordinates;
        const inRing = (ring, lat, lon) => {
          let c = false;
          for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
            const [xi, yi] = ring[i];
            const [xj, yj] = ring[j];
            if (yi > lat !== yj > lat && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) c = !c;
          }
          return c;
        };
        return (lat, lon) =>
          polys.some((p) => inRing(p[0], lat, lon) && !p.slice(1).some((h) => inRing(h, lat, lon)));
      }

      async function run() {
        await new Promise((r) => ymaps.ready(r));
        const proj = ymaps.projection.wgs84Mercator;
        const inUz = makeInside(UZ_BORDER);

        // 1. zoom 8 tiles over Uzbekistan's bounding box
        const z8 = 8;
        const [x0, y0] = proj.toGlobalPixels([45.7, 55.9], z8).map((v) => Math.floor(v / 256));
        const [x1, y1] = proj.toGlobalPixels([37.1, 73.3], z8).map((v) => Math.floor(v / 256));
        const z13 = new Set();
        for (let x = x0; x <= x1; x++)
          for (let y = y0; y <= y1; y++) {
            status(`Scanning zoom 8 tile ${x},${y}`);
            for (const [gx, gy] of await tilePixels(x, y, z8))
              z13.add(Math.floor((gx * 32) / 256) + "," + Math.floor((gy * 32) / 256));
          }

        // 2. zoom 13 tiles: a few spread-out seed pixels per tile
        const seeds = [];
        let n = 0;
        for (const key of z13) {
          const [x, y] = key.split(",").map(Number);
          status(`Sampling zoom 13 tiles ${++n} / ${z13.size}`);
          const px = (await tilePixels(x, y, 13)).sort(() => Math.random() - 0.5);
          const chosen = [];
          for (const g of px) {
            if (chosen.every((c) => Math.hypot(c[0] - g[0], c[1] - g[1]) > 70)) chosen.push(g);
            if (chosen.length >= SEEDS_PER_TILE) break;
          }
          for (const g of chosen) {
            const ll = proj.fromGlobalPixels(g, 13);
            if (inUz(ll[0], ll[1])) seeds.push(ll);
          }
        }

        // 3. confirm each seed with a real panorama
        const found = [];
        const seen = new Set();
        for (let i = 0; i < seeds.length; i++) {
          status(`Checking panoramas ${i + 1} / ${seeds.length} (found ${found.length})`);
          try {
            const r = await ymaps.panorama.locate(seeds[i]);
            if (!r.length) continue;
            const [lat, lon] = r[0].getPosition();
            const cell = Math.round(lat * 500) + ":" + Math.round(lon * 500); // ~200 m dedupe
            if (!inUz(lat, lon) || seen.has(cell)) continue;
            seen.add(cell);
            found.push([+lat.toFixed(5), +lon.toFixed(5)]);
          } catch {}
        }

        found.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        document.getElementById("out").value =
          "// Generated by tools/collect.html: points with a confirmed Yandex street panorama.\n" +
          "const LOCATIONS = [\n" +
          found.map((p) => `  [${p[0]}, ${p[1]}],`).join("\n") +
          "\n];\n";
        status(`Done: ${found.length} points. Copy into js/locations.js.`);
      }

      const s = document.createElement("script");
      const key = (window.UZG_CONFIG && window.UZG_CONFIG.yandexApiKey) || "";
      s.src = "https://api-maps.yandex.ru/2.1/?lang=ru_RU" + (key ? "&apikey=" + key : "");
      s.onload = () => run().catch((e) => status("Error: " + e));
      document.head.appendChild(s);
    </script>
  </body>
</html>
