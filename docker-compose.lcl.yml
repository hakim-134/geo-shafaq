# The game on the owner's laptop: nginx serving build/. The server is api-geo-shafaq's
# docker-compose.lcl.yml on :8131.
#
#   npm run lcl     # npm run build, then docker compose -f docker-compose.lcl.yml up -d

name: shafaq-web

services:
  web:
    image: nginx:stable-alpine
    container_name: shafaq-web
    restart: unless-stopped
    ports: ['8130:80']
    volumes:
      # the whole repo, not build/: each build replaces build/, and a mount of it would go stale
      - .:/srv/geo-shafaq:ro
      - ./nginx.lcl.conf:/etc/nginx/conf.d/default.conf:ro
