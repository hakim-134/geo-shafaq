# The game on the owner's laptop (docker-compose.lcl.yml): the built app, with every unknown
# path falling back to index.html, as on the real site.
server {
    listen 80;
    root /srv/geo-shafaq/build;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";    # always the latest build
    }
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
